[package]
name = "aether_native"
version = "0.1.0"
edition = "2021"
description = "Aether native datapath: SIMD GF(256) RLNC kernel and batched UDP I/O behind a C ABI (loaded from the JVM via Panama FFM)."
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
