[package]
name = "tessera_native"
version = "0.1.0"
edition = "2021"
description = "Tessera native datapath: SIMD GF(256) RLNC kernel and batched UDP I/O behind a C ABI (loaded from the JVM via Panama FFM)."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# RFC 8439 ChaCha20-Poly1305 for the packet AEAD (RustCrypto; runtime-dispatched SSE2/AVX2). See NOTICE.
chacha20poly1305 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
